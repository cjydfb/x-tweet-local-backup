 */
var VERIFIED_PATH = 'M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z';

function verifiedIcon() {
  return '<svg viewBox="0 0 22 22" width="19" height="19" fill="currentColor" ' +
    'aria-hidden="true"><path d="' + VERIFIED_PATH + '"/></svg>';

function span(cls, text) {
  var s = document.createElement('span');
  s.className = cls;
  if (text !== undefined) s.textContent = text;
  return s;
}

/**
 * One card. Everything here is layout and text: no request is issued, and the
 * only asynchrony is the media blob, which fills a box whose size was already
 * decided by the grid's aspect-ratio.
 */
function buildCard(node, i, r) {
  var author = r.author && typeof r.author === 'object' ? r.author : {};
  var handle = typeof author.screenName === 'string' && author.screenName.length ? author.screenName : '';
  var name = typeof author.name === 'string' && author.name.length ? author.name : (handle || '（没有作者信息）');

  node.appendChild(avatarNode(author, 40));

  var body = document.createElement('div');
  body.className = 'card__body';

  /* ---- header ---- */
  var head = document.createElement('div');
  head.className = 'card__head';
  head.appendChild(span('card__name', name));
  if (handle) {
    head.appendChild(span('card__handle', '@' + handle));
    head.appendChild(span('card__dot', '·'));
  }
  var t = span('card__time', fmtRelative(r.createdAt));
  t.title = fmtClock(r.createdAt) + '（' + tzLabel() + '）';
  head.appendChild(t);
  body.appendChild(head);

  /* ---- text ---- */
  var text = document.createElement('p');
  text.className = 'card__text';
  if (typeof r.text === 'string' && r.text.length) {
    text.appendChild(renderText(r));
  } else {
    text.classList.add('void');
    text.textContent = '（无正文）';
  }
  body.appendChild(text);

  /* ---- badges ---- */
  var badges = badgesFor(r);
  if (badges) body.appendChild(badges);

  /* ---- media ---- */
  if (Array.isArray(r.media) && r.media.length) body.appendChild(buildGrid(r));

  /* ---- poll ---- */
  if (r.isPoll) body.appendChild(buildPoll(r));

  /* ---- counts ---- */
  var acts = buildActs(r);
  if (acts) body.appendChild(acts);

  node.appendChild(body);
}

/* -------------------------------------------------------------- badges --- */

function badgesFor(r) {
  var items = [];
  if (r.isReply) items.push(['reply', '回复']);
  if (r.quoteTweetId) items.push(['quote', '引用']);
  if (r.isPoll) items.push(['poll', '投票']);
  if (r.isEdit) items.push(['edit', '编辑过']);
  if (r.deletedAt) items.push(['dead', '已删除']);
  if (r.supersededBy) items.push(['edit', '已被新版取代']);
  if (r.conversationIdInferred) items.push(['', '会话号为推断']);

  if (!items.length) return null;
  var wrap = document.createElement('div');
  wrap.className = 'badges';
  for (var k = 0; k < items.length; k++) {
    var b = span('badge' + (items[k][0] ? ' ' + items[k][0] : ''), items[k][1]);
    if (items[k][0] === 'dead') b.title = '删除时间：' + fmtClock(r.deletedAt);
    wrap.appendChild(b);
  }
  return wrap;
}

/* ---------------------------------------------------------------- text --- */

/**
 * The post's text with its links, hashtags and mentions marked up.
 *
 * Every stored entity is used as a WHITELIST, and the positions are found by
 * scanning the text rather than read out of the record: `entities.urls` stores
 * url / expandedUrl / displayUrl and hashtags are bare strings, so each
 * candidate the scan finds is kept only if the entity list confirms it. A
 * hashtag in somebody's post text that X did not classify as a hashtag stays
 * plain text, which is the right way round.
 *
 * Records written since schema v5 also carry `entities.spans` — the offsets X
 * itself measured, which an archived record always has and a live capture
 * usually does not. This function does not read them yet, and that is a gap
 * rather than a decision: the scan below has to stay for every record written
 * before v5 anyway, so switching to the stored offsets is a change worth making
 * on its own, with its own test, and not as a side effect of something else.
 * Until then they are carried and unused.
 *
 * `resolveSpans` then drops anything that overlaps a longer span, because X's
 * entities genuinely do overlap — a t.co link whose display text contains a
 * hashtag is the common case — and nesting anchors produces broken markup.
 */
function renderText(r) {
  var text = String(r.text || '');
  var ents = r.entities && typeof r.entities === 'object' ? r.entities : {};
  var tags = Array.isArray(ents.hashtags) ? ents.hashtags : [];
  var mentions = Array.isArray(ents.mentions) ? ents.mentions : [];

  var spans = [];
  var occ;
  collectUrlSpans(spans, text, Array.isArray(ents.urls) ? ents.urls : []);

  var lowerTags = tags.map(function (s) { return String(s).toLowerCase(); });
  var re = /#([\p{L}\p{N}_]+)/gu;
  while ((occ = re.exec(text)) !== null) {
    if (lowerTags.indexOf(occ[1].toLowerCase()) !== -1) {
      spans.push({ start: occ.index, end: occ.index + occ[0].length, kind: 'tag', href: null, text: occ[1] });
    }
  }

  var lowerWho = mentions.map(function (m) {
    return m && typeof m.screenName === 'string' ? m.screenName.toLowerCase() : '';
  });
  var reWho = /@([A-Za-z0-9_]{1,15})/g;
  while ((occ = reWho.exec(text)) !== null) {
    if (lowerWho.indexOf(occ[1].toLowerCase()) !== -1) {
      spans.push({ start: occ.index, end: occ.index + occ[0].length, kind: 'who', href: null, text: occ[1] });
    }
  }

  return renderSpansInto(document.createDocumentFragment(), text, resolveSpans(spans));
}

/**
 * Find where each stored URL actually appears in the text, and mark it.
 *
 * The stored entity is a WHITELIST, so each candidate is looked for by its own
 * text and only the ones actually found in the post are marked. Both spellings
 * are tried, the
 * display text first and the t.co address second, and the first one that matches
 * ends the search for that URL: a link written twice would otherwise produce two
 * overlapping spans for one thing, and resolveSpans would then drop the shorter
 * by accident rather than by rule.
 *
 * Both `entities.urls` and a profile's `bioUrls` have this shape, which is why
 * the post and the bio share this one function.
 */
function collectUrlSpans(spans, text, urls) {
  for (var k = 0; k < urls.length; k++) {
    var u = urls[k];
    if (!u || typeof u !== 'object') continue;
    var href = safeExternalUrl(u.expandedUrl) || safeExternalUrl(u.url);
    if (!href) continue;
    var needles = [];
    if (typeof u.displayUrl === 'string' && u.displayUrl) needles.push(u.displayUrl);
    if (typeof u.url === 'string' && u.url && needles.indexOf(u.url) === -1) needles.push(u.url);
    /* Per URL, not over the whole span list: with the global count, a second URL
       was skipped entirely whenever the first one had matched, because the
       check saw the first URL's spans and stopped before trying its own t.co
       address. */
    var before = spans.length;
    for (var n = 0; n < needles.length; n++) {
      var at = 0, occ;
      while ((occ = text.indexOf(needles[n], at)) !== -1) {
        spans.push({ start: occ, end: occ + needles[n].length, kind: 'url', href: href });
        at = occ + needles[n].length;
      }
      if (spans.length > before) break;   /* the first needle that matches wins */
    }
  }
}

/**
 * Emit a text with its resolved spans: the literal text between them, an anchor
 * for a URL, a styled span for a hashtag or a mention.
 *
 * Shared by the post text and the profile's bio. A hashtag and a mention are
 * deliberately NOT links: they point at a site that may no longer have the
 * account, which is precisely why the archive exists. They are marked up so the
 * text reads the way it was written, and following one would leave the archive
 * to land nowhere.
 */
function renderSpansInto(frag, text, spans) {
  var cursor = 0;
  for (var k = 0; k < spans.length; k++) {
    var s = spans[k];
    if (s.start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, s.start)));
    if (s.kind === 'url') {
      var a = document.createElement('a');
      a.href = s.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = text.slice(s.start, s.end);
      frag.appendChild(a);
    } else {
      var spanEl = document.createElement('span');
      spanEl.className = s.kind === 'tag' ? 'tag' : 'who';
      spanEl.textContent = text.slice(s.start, s.end);
      frag.appendChild(spanEl);
    }
    cursor = s.end;
  }
  if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
  return frag;
}

/**
 * The profile's bio, with its links, as a fragment — or null when there is none.
 *
 * Only URLs are marked up. A post's hashtags and mentions are confirmed against
 * the record's own entity lists, and a profile has no entity list to confirm
 * them with: a `profile.bioUrls` array is all the envelope carries. Guessing
 * that `#tag` is a hashtag because it looks like one is the opposite of the rule
 * the cards follow, so anything that is not a stored URL stays plain text.
 */
function renderBio(p) {
  var bio = typeof p.bio === 'string' ? p.bio : '';
  if (!bio) return null;
  var spans = [];
  collectUrlSpans(spans, bio, Array.isArray(p.bioUrls) ? p.bioUrls : []);
  return renderSpansInto(document.createDocumentFragment(), bio, resolveSpans(spans));
}

/* --------------------------------------------------------------- media --- */

/**
 * The media grid. Its height is decided here, before any file is read: the
 * aspect-ratio comes from the media metadata, so a late-arriving image cannot
 * change the card's height and the scroller never has to correct itself.
 */
function buildGrid(r) {
  var media = r.media;
  var shown = Math.min(media.length, 4);
  var shape = gridShape(media.length);

  var grid = document.createElement('div');
  grid.className = 'grid n' + shape;
  grid.dataset.count = String(media.length);

  grid.style.aspectRatio = aspectFor(media[0], shape);

  for (var k = 0; k < shown; k++) {
    var cell = buildCell(r.id, media[k], k);
    if (k === 3 && media.length > 4) {
      var more = document.createElement('div');
      more.className = 'more';
      more.textContent = '+' + (media.length - 3);
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }
  return grid;
}

/**
 * Width/height for the whole grid.
 *
 * A single item uses its own ratio so the picture is not cropped; anything
 * multi-item uses a fixed shape, because a grid of tiles has no single ratio to
 * inherit. The clamp is what keeps a 1:4 panorama or a 9:1 strip from making one
 * card several screens tall — X crops those too.
 */
function aspectFor(m, shape) {
  if (shape >= 4) return '1 / 1';
  var pair = m && Array.isArray(m.aspectRatio) ? m.aspectRatio : null;
  if (!pair) return '16 / 9';
  var w = Number(pair[0]), h = Number(pair[1]);
  if (!(w > 0) || !(h > 0)) return '16 / 9';
  var ratio = w / h;
  if (ratio < 0.65) return '0.65 / 1';
  if (ratio > 2.4) return '2.4 / 1';
  return w + ' / ' + h;
}

var MEDIA_LABEL = { photo: '图片', video: '视频', animated_gif: '动图' };

function buildCell(tweetId, m, k) {
  var cell = document.createElement('div');
  cell.className = 'cell';
  if (!m || typeof m !== 'object') {
    cell.appendChild(placeholder('（这一项媒体信息不完整）'));
    return cell;
  }

  var key = mediaKeyFor(tweetId, m.id);
  var isVideo = m.type === 'video' || m.type === 'animated_gif';
  var inArchive = !!(key && archive.mediaMap && archive.mediaMap.has(key));

  if (isVideo) {
    /* A video cell does NOT load its file. It used to — an <img> pointed at the
       media key, which for a video resolves to an MP4, and an image element
       cannot decode one: every video in the grid fell through to the error
       branch and announced that its file was unreadable, whether it was or not.
       A real still would mean running a decoder per cell behind a scrolling
       timeline. So the cell says "video, this long" and nothing more, and the
       file itself is read only when the lightbox opens. */
    if (!inArchive) cell.appendChild(placeholder('视频文件不在这个归档里'));
    var play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶';
    cell.appendChild(play);
    if (typeof m.durationMs === 'number' && m.durationMs > 0) {
      var dur = document.createElement('div');
      dur.className = 'dur';
      dur.textContent = fmtDuration(m.durationMs);
      cell.appendChild(dur);
    }
  } else if (key && inArchive) {
    var img = document.createElement('img');
    img.alt = typeof m.altText === 'string' ? m.altText : '';
    img.loading = 'lazy';
    img.decoding = 'async';
    cell.appendChild(img);
    attachMedia(cell, img, key, m);
  } else {
    cell.appendChild(placeholder(
      (MEDIA_LABEL[m.type] || '媒体') +
      (key ? '文件不在这个归档里' : '（没有可用的媒体 id）')));
  }

  cell.__mi = k;
  cell.__media = m;
  cell.__key = key;
  cell.style.cursor = 'pointer';
  return cell;
}

/** X writes durations as m:ss. */
function fmtDuration(ms) {
  var total = Math.round(ms / 1000);
  var m = Math.floor(total / 60);
  var s = total % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/**
 * Resolve the file and put it in the cell.
 *
 * Nothing is assumed about the archive still being there: the file may have been
 * moved or deleted since the page loaded, and a blob: read then fails
 * asynchronously. The cell says which of the two happened, because a silent
 * blank is indistinguishable from "this archive never had the file".
 */
function attachMedia(cell, img, key, m) {
  getMediaUrl(key, mimeFor(m, 0)).then(function (url) {
    if (!url) {
      cell.textContent = '';
      cell.appendChild(placeholder(
        (MEDIA_LABEL[m.type] || '媒体') + '文件不在这个归档里' +
        (m.altText ? '：' + m.altText : '')));
      return;
    }
    img.addEventListener('error', function () {
      cell.textContent = '';
      cell.appendChild(placeholder('这个媒体文件读不出来（归档可能被移动过）'));
    });
    img.src = url;
  }).catch(function () {
    cell.textContent = '';
    cell.appendChild(placeholder('媒体文件读取失败'));
  });
}

function placeholder(text) {
  var d = document.createElement('div');
  d.className = 'ph';
  d.textContent = text;
  return d;
}

/* ---------------------------------------------------------------- poll --- */

function buildPoll(r) {
  var p = r.poll && typeof r.poll === 'object' ? r.poll : {};
  var box = document.createElement('div');
  box.className = 'poll';

  var choices = Array.isArray(p.choices) ? p.choices : [];
  if (choices.length) {
    var ol = document.createElement('ol');
    for (var k = 0; k < choices.length; k++) {
      var li = document.createElement('li');
      li.textContent = choices[k];
      ol.appendChild(li);
    }
    box.appendChild(ol);
  } else {
    var none = document.createElement('div');
    none.className = 'ph';
    none.textContent = '投票选项没有随发帖响应一起返回，所以归档里没有选项文字。';
    box.appendChild(none);
  }

  var note = document.createElement('p');
  note.className = 'note';
  var bits = [];
  if (p.endDatetimeUtc) bits.push('结束于 ' + fmtClock(p.endDatetimeUtc));
  if (p.cardName) bits.push('卡片类型 ' + p.cardName);
  bits.push(p.choicesFromResponse === false ? '选项来源：不在响应里' : '选项来源：发帖响应');
  note.textContent = bits.join(' · ');
  box.appendChild(note);
  return box;
}

/* --------------------------------------------------------------- counts -- */

/**
 * The counts row.
 *
 * No hover state and a single grey for every icon: these are numbers X reported
 * when the post was captured, and this archive holds no record of whether *you*
 * liked or reposted anything, so a coloured heart or green arrows would be an
 * invention. The row carries no handler of its own — a click on it bubbles to
 * the card and opens the post, like any other part of the card.
 */
/**
 * The link to one record.
 *
 * `tweetUrl` is what the extension wrote and is preferred. It can be missing in
 * a record that was merged or hand-assembled, and then the id and the handle are
 * enough to rebuild it. Null when neither is available — every caller has
 * something to say about that, and one definition of "this record's URL" is what
 * keeps the card's share control and the post page's 复制链接 from drifting.
 */
function tweetLinkOf(r) {
  var stored = r && safeExternalUrl(r.tweetUrl);
  if (stored) return stored;
  if (r && r.author && r.author.screenName && /^[0-9]+$/.test(String(r.id))) {
    return 'https://x.com/' + r.author.screenName + '/status/' + r.id;
  }
  return null;
}

function buildActs(r) {
  var m = r.metrics && typeof r.metrics === 'object' ? r.metrics : {};
  /* The four figures X reports, then the two that close its row.
   *
   * The last two never carry a number and that is not missing data: a bookmark
   * count is not public on X, and there is nothing to count about a share. They
   * are here for the shape of the row, which is what the reader is reproducing.
   * The fourth slot says exactly that, because it has to be told apart from the
   * `.none` case — an entry with no number because the capture did not carry
   * one is HIDDEN but keeps its space, so the icons line up across every card.
   * A bookmark drawn that way would vanish. */
  var defs = [
    ['reply', m.replyCount, '回复', false],
    ['repost', m.retweetCount, '转发', false],
    ['like', m.likeCount, '喜欢', false],
    ['views', m.viewCount, '查看', false],
    ['bookmark', null, '收藏', true],
    ['share', null, '分享', true]
  ];
  var any = defs.some(function (d) { return typeof d[1] === 'number'; });
  if (!any) return null;

  var wrap = document.createElement('div');
  wrap.className = 'acts';
  wrap.title = '这一行是捕获时 X 报出的样子：数字是当时的，不是实时的。' +
    '只有分享能点——复制这条的链接。';

  for (var k = 0; k < defs.length; k++) {
    var d = defs[k];
    var counted = typeof d[1] === 'number';
    var numberless = d[3] === true;
    /* 分享 is the one control in this row that does anything, so it is a real
       button — reachable by keyboard and announced as one — while still wearing
       the row's own look. See the .act[type=button] rule. */
    var isShare = d[0] === 'share';
    var item = document.createElement(isShare ? 'button' : 'span');
    if (isShare) item.type = 'button';
    item.className = 'act ' + d[0] + (counted || numberless ? '' : ' none');

    var iconBox = document.createElement('i');
    iconBox.innerHTML = icon(d[0]);
    item.appendChild(iconBox);

    /* Only the counted four get a figure. A 0 beside the bookmark would be
       inventing a number the archive does not hold. */
    if (counted) {
      var num = document.createElement('span');
      num.textContent = fmtCount(d[1]);
      item.appendChild(num);
    } else if (numberless) {
      item.title = d[2];
    }

    if (isShare) {
      /* stopPropagation, not preventDefault: the whole card is a click target
         that opens the post, and without this a reader trying to copy a link
         would get the post page instead. */
      item.title = '复制这条的链接';
      item.setAttribute('aria-label', '复制这条的链接');
      item.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var link = tweetLinkOf(r);
        if (link) copyText(link, '链接已复制');
        else copyText(String(r.id), '没有可用的链接，已复制 ID');
      });
    }

    wrap.appendChild(item);
  }
  return wrap;
}

/* -------------------------------------------------------------- search --
 *
 * Full-text search that does not undo the memory design.
 *
 * The whole point of the byte-offset index is that a hundred thousand posts cost
 * a few megabytes of heap. Parsing every record to search would throw that away
 * in one go, so the scan reads the file in batches, parses each record out of the
 * batch buffer, tests it, and then lets it go: only the *positions* of the
 * matches are kept.
 *
 * The index already holds exact byte ranges, so the scan walks those rather than
 * re-scanning the byte stream. That is both faster and, more importantly, it
 * stops at the end of the tweets array by construction — the `connections` roster
 * that follows it is never read, and on a large archive that section alone is
 * tens of megabytes.
 * ------------------------------------------------------------------------ */

var SEARCH_BATCH = 400;
var SEARCH_MIN_CHARS = 1;

/**
 * Back to the timeline, with no query.
 *
 * `cancelScan()` comes first and is the part that is easy to leave out. Without
 * it an in-flight search keeps running: its visitor's `search.gen !== gen` guard
 * still passes, so it goes on appending to the list that was just emptied, and
 * when it finishes it takes the progress bar down, re-renders the timeline and
 * prints a search result message over it. Nothing about that is visible until
 * the scan lands, several hundred milliseconds later.
 */
function timelineMode() {
  cancelScan();
  list.mode = 'timeline';
  list.q = '';
  list.terms = [];
  list.hits = [];
  search.hits = 0;
  composeList();
  applyList(true);
  say('');
}

/**
 * Everything that has to happen after the displayed list changes shape.
 *
 * One function because these steps are one operation: the height table is sized
 * from `list.length()`, which only reads correctly once `list.ids` has been
 * composed, and the window can only be placed once the table exists. Splitting
 * them is exactly how the search path came to append rows to a table that had
 * been built for the whole archive.
 *
 * The record cache is deliberately NOT cleared: it is keyed by record index, and
 * the same record is the same record whichever list is showing it.
 */
function applyList(resetScroll) {
  if (resetScroll) el.scroller.scrollTop = 0;
  clearWindow();
  rebuildHeights();
  paintStickyBar();
  renderWindow(true);
  statsLine();
}

/**
 * Everything about a record that is worth searching, as one lowercased string.
 *
 * Concatenated rather than tested field by field so that every term has to be
 * present somewhere in the record: "alice photo" finds a post by @alice that has
 * a photo, which is the behaviour a search box implies. The expanded URL is
 * included because it is the only real address the archive holds — the t.co link
 * in the text is a redirect that will stop resolving long before the archive
 * does.
 */
function searchHaystack(r) {
  var parts = [];
  if (typeof r.text === 'string') parts.push(r.text);
  parts.push(String(r.id || ''));
  var a = r.author && typeof r.author === 'object' ? r.author : {};
  if (a.name) parts.push(String(a.name));
  if (a.screenName) parts.push(String(a.screenName));

  var ents = r.entities && typeof r.entities === 'object' ? r.entities : {};
  if (Array.isArray(ents.hashtags)) parts.push(ents.hashtags.join(' '));
  if (Array.isArray(ents.mentions)) {
    for (var i = 0; i < ents.mentions.length; i++) {
      var m = ents.mentions[i];
      if (m && m.screenName) parts.push(String(m.screenName));
      if (m && m.name) parts.push(String(m.name));
    }
  }
  if (Array.isArray(ents.urls)) {
    for (var u = 0; u < ents.urls.length; u++) {
      var e = ents.urls[u];
      if (!e) continue;
      if (e.expandedUrl) parts.push(String(e.expandedUrl));
      if (e.displayUrl) parts.push(String(e.displayUrl));
    }
  }
  if (Array.isArray(r.media)) {
    for (var k = 0; k < r.media.length; k++) {
      var md = r.media[k];
      if (md && md.altText) parts.push(String(md.altText));
    }
  }
  if (r.poll && Array.isArray(r.poll.choices)) parts.push(r.poll.choices.join(' '));
  if (r.replyTo && r.replyTo.screenName) parts.push(String(r.replyTo.screenName));
  if (r.tweetUrl) parts.push(String(r.tweetUrl));

  return parts.join('\n').toLowerCase();
}

function haystackMatches(hay, terms) {
  for (var i = 0; i < terms.length; i++) {
    if (hay.indexOf(terms[i]) === -1) return false;
  }
  return true;
}

/**
 * Walk the archived records once, in batches, calling `visit(recordIndex, r)`.
 *
 * The batch is one Blob read and one decode per record. Decoding per record
 * rather than slicing a decoded string is deliberate: offsets in the index are
 * BYTES, and a JavaScript string index is UTF-16 code units, so the two diverge
 * the moment a post contains a non-ASCII character — which, in this archive, is
 * immediately.
 *
 * `label` replaces the progress text for a caller that is not a search — the tab
 * filter reads the same bytes for a different reason, and a progress bar that
 * says 搜索中 while no search is running is a lie about what the machine is
 * doing.
 */
async function scanRecords(visit, gen, label) {
  var ranges = archive.ranges;
  var n = ranges.length;
  var decoder = new TextDecoder();
  var i = 0;

  while (i < n) {
    if (job.cancelled) return 'cancelled';

    /* A superseded scan must STOP, not merely stop producing output.
     *
     * Without this the old loop runs the file to the end regardless: `job.
     * cancelled` cannot catch it, because the job that replaced it cleared that
     * flag the moment it started. What the user sees is the new job's progress
     * text being overwritten by the old job's, several times a second, until the
     * whole file has been read a second time for nothing. */
    if (gen !== undefined && gen !== search.gen) return 'cancelled';

    /* One batch — but never across a file boundary. The slice below assumes
       every range in it lives in the same Blob AND that `start` does not
       decrease. With two files open both are false, and the failure is silent:
       the decode reads the wrong bytes, JSON.parse throws, and `continue` drops
       the record as merely unreadable. The search then reports a confident
       count with rows missing from it. */
    var owner = sourceOf(i);
    if (owner === null) return 'cancelled';
    var j = i + 1;
    while (j < n && j < i + SEARCH_BATCH && ranges[j].src === ranges[i].src) j++;

    var from = ranges[i].start;
    var to = ranges[j - 1].end;
    var buf = new Uint8Array(await owner.source.slice(from, to).arrayBuffer());

    for (var k = i; k < j; k++) {
      var text = decoder.decode(buf.subarray(ranges[k].start - from, ranges[k].end - from));
      var r;
      try {
        r = JSON.parse(text);
      } catch (_) {
        continue;   /* an unreadable record is skipped, not counted as a match */
      }
      visit(k, r);
    }

    i = j;
    search.scanned = i;
    /* Only the job that owns the bar may write to it. */
    if (gen === undefined || gen === search.gen) {
      progressSet(label
        ? label + i + ' / ' + n
        : '搜索中…' + i + ' / ' + n + '　命中 ' + search.hits, n ? i / n : 1);
    }
    await new Promise(function (res) { setTimeout(res, 0); });
  }
  return 'done';
}

var searchTimer = null;

function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { runSearch(el.q.value); }, 250);
}

/**
 * Start a list job: supersede whatever ran before, and claim the next
 * generation.
 *
 * One place, so that a scan's own generation can only ever be compared against
 * a counter that every starter shares.
 */
function beginScan() {
  search.gen++;
  job.cancelled = false;
  return search.gen;
}

async function runSearch(query) {
  var q = String(query === undefined ? el.q.value : query);

  /* Checked before a generation is taken, because timelineMode() is itself an
     invalidator — bumping here and again inside it would leave the two
     disagreeing about which generation is current. */
  if (q.trim().length < SEARCH_MIN_CHARS) {
    timelineMode();
    return;
  }

  var gen = beginScan();

  list.mode = 'search';
  list.q = q.trim();
  list.terms = list.q.toLowerCase().split(/\s+/).filter(function (s) { return s.length > 0; });
  list.hits = [];
  /* Deliberately NOT composeList() yet. `ids` keeps pointing at the list that is
     still on screen, so the timeline stays visible — and, more importantly,
     stays consistent with the height table that is still built for it. Deriving
     `ids` from an empty hits array here would leave every rendered row asking
     for a record that does not exist, which is the very failure this file was
     just fixed for. */
  search.running = true;
  search.scanned = 0;
  search.total = archive.ranges.length;
  search.hits = 0;

  progressStart('搜索中…');
  say('');

  var outcome = await scanRecords(function (idx, r) {
    if (search.gen !== gen) return;
    if (haystackMatches(searchHaystack(r), list.terms)) {
      list.hits.push(idx);
      search.hits++;
    }
  }, gen);

  if (gen !== search.gen) return;   /* a newer search or a new file took over */
  progressEnd();
  search.running = false;

  /* The table is rebuilt once, at the end, from the finished list. Building it
     during the scan would mean growing and re-rendering on every batch while
     the user is only waiting; the progress bar is the feedback for that. */
  composeList();
  applyList(true);

  var hits = list.hits.length;
  if (outcome === 'cancelled') {
    say('<div class="box warn">搜索已停止。已经扫过的部分里找到 <b>' + hits + '</b> 条，' +
        '下面只显示这些——<b>没扫到的部分不算数</b>。</div>', 'warn');
  } else if (hits === 0) {
    say('<div class="box">「' + esc(list.q) + '」没有找到任何记录。' +
        '搜索范围是正文、ID、作者昵称与用户名、话题标签、@提及、链接的展开地址、媒体的替代文字和投票选项。</div>');
  } else {
    say('<div class="box ok">「' + esc(list.q) + '」找到 <b>' + hits + '</b> 条，' +
        '用时 ' + ((performance.now() - job.startedAt) / 1000).toFixed(1) + ' 秒。' +
        '结果按归档顺序排列。</div>', 'ok');
  }
}

/* ---------------------------------------------------------- jump to day -- */

/**
 * The archive's time order, measured rather than assumed.
 *
 * The extension writes newest first, so index 0 is the newest post — but that is
 * a property of the writer, not of the format, and a merged or hand-edited file
 * can be either way round. Nine spread-out probes are enough to tell, and being
 * wrong here would send every date jump to the wrong place.
 */
async function detectOrder() {
  if (jump.orderChecked) return jump.order;
  jump.orderChecked = true;
  var n = archive.ranges.length;
  if (n < 3) { jump.order = 'asc'; return jump.order; }

  var probes = Math.min(9, n);
  var times = [];
  for (var k = 0; k < probes; k++) {
    var i = Math.floor(k * (n - 1) / (probes - 1));
    times.push(await readCreatedAt(i));
  }

  var up = 0, down = 0;
  for (var j = 1; j < times.length; j++) {
    if (!isFinite(times[j]) || !isFinite(times[j - 1])) continue;
    if (times[j] > times[j - 1]) up++;
    else if (times[j] < times[j - 1]) down++;
  }
  var total = up + down;
  if (total === 0) jump.order = 'asc';
  else if (down / total >= 0.9) jump.order = 'desc';
  else if (up / total >= 0.9) jump.order = 'asc';
  else jump.order = 'mixed';
  return jump.order;
}

/** One record's timestamp, from a short head read when the field is near the front. */
async function readCreatedAt(i) {
  var r = archive.ranges[i];
  if (!r) return NaN;
  var owner = sourceOf(i);
  if (owner === null) return NaN;
  var head = await owner.source.slice(r.start, Math.min(r.end, r.start + 512)).text();
  var m = head.match(/"createdAt"\s*:\s*"([^"]+)"/);
  if (m) return Date.parse(m[1]);
  /* `text` sits before `createdAt` in the record, and it is capped at the
     extension's text limit — so for a long post the field is further in.
     Falling back to a full read is rare and correct. */
  var res = await readRecordAt(owner.source, r);
  return res.ok ? Date.parse(res.value.createdAt) : NaN;
}

/**
 * Run `fn` once the rows on screen have all been read and measured.
 *
 * Used after a jump, which needs two attempts to be exact — see jumpToDay.
 * Bounded, because a record that never loads must not leave the caller hanging.
 */
function whenSettled(fn, maxMs) {
  var t0 = performance.now();
  var step = function () {
    var settled = pending.size === 0 && pendingMeasures.size === 0 && !measureFlushQueued;
    if (settled || performance.now() - t0 > (maxMs || 1500)) { fn(); return; }
    window.requestAnimationFrame(step);
  };
  window.requestAnimationFrame(step);
}

/**
 * Scroll so that one row sits at the top of the viewport.
 *
 * Twice, and the second pass is the one that matters. The rows above the target
 * have never been rendered, so their heights are estimates — the estimate is
 * only ever a guess from a record's byte length, and a few thousand of them
 * accumulate into a landing point that is tens of rows off. Once the target is
 * on screen the rows around it are measured, and re-applying the same offset
 * against the corrected table puts the row exactly at the top.
 */
function aimAt(found) {
  /* `offsetOf` is a row offset; scrollTop is a position in content that begins
     with the header. The two differ by exactly headSpace(). */
  var y = function () { return heights.offsetOf(found) + headSpace(); };
  el.scroller.scrollTop = y();
  renderWindow(true);
  whenSettled(function () {
    el.scroller.scrollTop = y();
    renderWindow(true);
  }, 2000);
}

async function jumpToDay(ymd) {
  if (!archive.ranges.length) return;
  var offset = display.offsetMinutes === null ? 0 : display.offsetMinutes;
  var dayStart = dayStartMs(ymd, offset);
  if (dayStart === null) return;
  /* A fixed offset has no daylight saving, so the next midnight is exactly one
     day later. That is the whole reason the display zone is an offset and never
     an IANA name. */
  var dayEnd = dayStart + 86400000;

  progressStart('正在定位 ' + ymd + '…');
  job.cancelled = false;
  var order = await detectOrder();
  var n = archive.ranges.length;
  var found = -1;

  if (order === 'mixed') {
    /* Nothing better is available: with no consistent order there is no
       monotone function to bisect. A strided sweep finds the neighbourhood, and
       the result is reported as approximate rather than presented as exact. */
    var best = -1, bestDelta = Infinity;
    for (var s = 0; s < n; s += 200) {
      if (job.cancelled) break;
      var t = await readCreatedAt(s);
      if (!isFinite(t)) continue;
      var d = Math.abs(t - dayStart);
      if (d < bestDelta) { bestDelta = d; best = s; }
      if (s % 4000 === 0) progressSet('正在扫描 ' + s + ' / ' + n + '…', n ? s / n : 1);
    }
    found = best < 0 ? -1 : best;
  } else {
    /* Bisect for the FIRST record of the day, not the last record before it.
       Because the timeline reads newest first, the first index of the day is
       what belongs at the top of the viewport, with the rest of the day running
       down from it. Bisecting on the day's *end* is what finds that index; on
       its start it would find the last post of the previous day, which is a
       whole day's worth of scrolling in the wrong direction.
       ~17 record reads for a hundred thousand posts. */
    var lo = 0, hi = n - 1, ans = -1;
    var guard = 0;
    while (lo <= hi && guard++ < 64) {
      if (job.cancelled) break;
      var mid = (lo + hi) >> 1;
      var tm = await readCreatedAt(mid);
      if (!isFinite(tm)) { lo = mid + 1; continue; }
      var past = order === 'desc' ? (tm < dayEnd) : (tm >= dayStart);
      if (past) { ans = mid; hi = mid - 1; } else { lo = mid + 1; }
    }
    found = ans;
  }

  progressEnd();
  if (job.cancelled) return;

  if (found < 0) {
    /* No index satisfied the predicate, which means every record is newer than
       the end of that day — the date is older than anything in the archive. */
    say('<div class="box warn">归档里没有 ' + esc(ymd) +
      ' 这么早的记录——它比归档里最早的一条还早。</div>', 'warn');
    return;
  }

  /* The bisection searched the ARCHIVE and produced a record index; the scroller
     works in positions, and the two are the same number only while nothing is
     filtered. Under a search or a tab they are not, so the index is translated
     — and when the record is not in the list at all, that is said rather than
     scrolled to somewhere arbitrary. */
  var pos = list.positionOf(found);
  if (pos < 0) {
    say('<div class="box warn">第 ' + (found + 1) + ' 条就在归档里，但它不在当前的' +
      (list.mode === 'search' ? '搜索结果' : '筛选') +
      '里。清空搜索或切到「所有」就能看到它。</div>', 'warn');
    return;
  }
  aimAt(pos);
  var landed = await readCreatedAt(found);
  var sameDay = isFinite(landed) && landed >= dayStart && landed < dayEnd;

  if (!sameDay) {
    say('<div class="box warn"><b>' + esc(ymd) + ' 这天没有记录。</b>最近的记录是第 ' +
      (found + 1) + ' 条（' +
      esc(isFinite(landed) ? fmtClock(new Date(landed).toISOString()) : '时间读不出来') +
      '），已经跳到它。</div>', 'warn');
    return;
  }
  say('<div class="box">已跳到 <b>' + esc(ymd) + '</b>：从第 ' + (found + 1) + ' 条开始，' +
      esc(fmtClock(new Date(landed).toISOString())) + '。' +
      (order === 'mixed'
        ? '<b>这个归档的记录不是按时间排好序的</b>，所以这是最接近的一条，不保证正好是那天的第一条。'
        : '') + '</div>', order === 'mixed' ? 'warn' : '');
}

/* ---------------------------------------------------------------- tabs --
 *
 * The account header and the three tabs above the timeline.
 *
 * What is here and what is deliberately not:
 *
 *   - 转帖 and 文章 are absent. The extension does not match CreateRetweet, so
 *     no record in any archive is a retweet and a 转帖 tab would be empty
 *     forever; and a long-form post arrives through CreateNoteTweet and is
 *     stored as an ordinary record with ordinary text, so there is no predicate
 *     that would put anything in 文章 either. A tab that can never be filled is
 *     a claim about the file that is not true.
 *   - The filter is not a search. It narrows the archive's own order to a
 *     subset, and all three subsets come out of ONE scan of every record — the
 *     first tab click pays for that pass (measured: 76 ms over twenty thousand
 *     records read from memory, 173 ms over fifty thousand; a file on disk is
 *     slower), and every later one is instant.
 *   - Nothing here touches the byte-offset index or the height table. A tab is
 *     one more way of filling in `list.ids`, and every consumer of the list
 *     already goes through length()/at().
 * ------------------------------------------------------------------------ */

var filters = {
  posts: null,      /* record indices that are not replies */
  replies: null,    /* record indices that are replies */
  media: null,      /* record indices carrying at least one media item */
  /* The two maps the post page needs, filled by the same pass. One id lookup
     each way round: `byId` answers "where is the post this one replies to", and
     `repliesOf` answers "which of my posts reply to this one". Neither can be
     answered by scanning the visible list, because the other end of a
     conversation is usually not on screen and often not in the current tab. */
  byId: null,       /* tweetId -> record index */
  repliesOf: null,  /* tweetId -> record indices that name it in replyTo */
  built: false,     /* everything above is filled */
  building: null,   /* the promise of the pass in flight, or null */
  buildGen: -1      /* the generation that pass claimed */
};

/** What the tab row and the scope select currently ask the list to show. */
function currentFilter() {
  if (list.tab === 'replies') return 'replies';
  if (list.tab === 'media') return 'media';
  return list.scope === 'posts' ? 'posts' : 'all';
}

/** The filter lists are a fact about the FILE, so a new file drops them. */
function invalidateFilters() {
  filters.posts = null;
  filters.replies = null;
  filters.media = null;
  filters.byId = null;
  filters.repliesOf = null;
  filters.built = false;
  filters.building = null;
  filters.buildGen = -1;
}

/**
 * Is this record a reply — by either of the two marks it can carry.
 *
 * Both are checked because both exist in the wild. `isReply` is what this
 * extension writes; `replyTo` is what a record merged from another machine, or
 * written by an older version, carries instead. Reading only one of them files
 * some replies under 帖子 and some posts under 回复, which is a wrong answer
 * rather than a missing one.
 */
function isReplyRecord(r) {
  if (!r || typeof r !== 'object') return false;
  if (r.isReply === true) return true;
  return !!(r.replyTo && r.replyTo.tweetId);
}

/**
 * Build all three filter lists in ONE pass over the archive.
 *
 * One pass, not three: the three lists are three readings of the same record
 * (is it a reply, does it carry media), so a reader who visits every tab would
 * otherwise read the whole file three times.
 *
 * Only one pass may be in flight. A second caller joins the pass that is already
 * running instead of starting a rival that would double the work and race it —
 * but it joins only while that pass still owns the generation. A pass that has
 * been superseded (another tab, a search, a new file) is dead: joining it would
 * hand this caller a cancellation it did not ask for.
 *
 * Resolves true when the lists are usable, false when the pass did not finish.
 */
function ensureFilters() {
  if (filters.built) return Promise.resolve(true);
  if (filters.building && filters.buildGen === search.gen) return filters.building;

  var gen = beginScan();
  filters.buildGen = gen;
  var posts = [], replies = [], media = [];
  var byId = new Map(), repliesOf = new Map();

  progressStart('正在建立筛选索引…');
  filters.building = scanRecords(function (idx, r) {
    if (search.gen !== gen) return;
    if (isReplyRecord(r)) replies.push(idx); else posts.push(idx);
    if (Array.isArray(r.media) && r.media.length > 0) media.push(idx);

    if (typeof r.id === 'string' && r.id.length > 0) byId.set(r.id, idx);
    /* The parent id is not validated here — it is looked up, not trusted, and a
       reply naming a tweet that is not in the archive simply finds nothing. */
    var parent = r.replyTo && typeof r.replyTo.tweetId === 'string' ? r.replyTo.tweetId : null;
    if (parent !== null && parent.length > 0) {
      var kids = repliesOf.get(parent);
      if (kids === undefined) repliesOf.set(parent, [idx]);
      else kids.push(idx);
    }
  }, gen, '正在建立筛选索引…').then(function (outcome) {
    /* Superseded. A newer job owns the bar and the progress text, so this one
       must not take the bar down, and must not write into `filters` — the
       arrays it is holding are for a list nobody is looking at. */
    if (gen !== search.gen) return false;
    filters.building = null;
    progressEnd();
    if (outcome !== 'done') return false;
    filters.posts = posts;
    filters.replies = replies;
    filters.media = media;
    filters.byId = byId;
    filters.repliesOf = repliesOf;
    filters.built = true;
    return true;
  });
  return filters.building;
}

/**
 * Which tab click is the current one.
 *
 * A click that has been superseded must not repaint the row or revert a tab the
 * reader has chosen since — and the filter build it is waiting on can take a
 * third of a second, which is long enough for another click to arrive.
 */
var tabs = { gen: 0 };

/**
 * Show one tab.
 *
 * The order of the steps is the whole of it. cancelScan() first, so a search
 * still running cannot land after the list has been replaced and print its
 * results over the new one. The filter build second, because nothing below it
 * can be computed until the list exists. The scroll reset last, inside
 * applyList, because every list is applied through the one path that also
 * resizes the height table — and the table is sized from the list.
 *
 * The search is CLEARED rather than intersected with. composeList can intersect
 * the two, but a tab is a request to see that column's records, and a query left
 * in the box while the list shows more than it matched — or fewer — is a control
 * that disagrees with what is on screen.
 */
async function selectTab(tab, scope) {
  if (tab !== 'posts' && tab !== 'replies' && tab !== 'media') return;
  var prevTab = list.tab, prevScope = list.scope;
  var token = ++tabs.gen;
  var fileGen = archive.gen;

  list.tab = tab;
  if (tab === 'posts') list.scope = scope === 'posts' ? 'posts' : 'all';

  cancelScan();
  paintTabs();

  if (currentFilter() !== 'all') {
    var ok = await ensureFilters();
    /* A different file is open, or a later click has taken over: whoever
       replaced this one owns the screen now and will paint it. */
    if (token !== tabs.gen || fileGen !== archive.gen) return;
    if (!ok) {
      list.tab = prevTab;
      list.scope = prevScope;
      paintTabs();
      say('<div class="box warn">筛选索引没有建完（被取消，或被别的操作取代），这一栏没有切换。' +
          '再点一次可以重来。</div>', 'warn');
      return;
    }
  }

  list.mode = 'timeline';
  list.q = '';
  list.terms = [];
  list.hits = [];
  search.hits = 0;
  el.q.value = '';
  composeList();
  applyList(true);
  say('');
}

/** The tab row's .on state and the scope select's visibility, from `list`. */
function paintTabs() {
  var buttons = el.tabs.querySelectorAll('.tab');
  for (var k = 0; k < buttons.length; k++) {
    buttons[k].classList.toggle('on', buttons[k].dataset.tab === list.tab);
  }
  /* The scope belongs to 帖子 alone: it says what THAT column means, and under
     回复 or 媒体 it would be a control for something it does not control. */
  el.scope.hidden = list.tab !== 'posts';
  el.scope.value = list.scope;
}

/* ------------------------------------------------------- open archives -- */

/**
 * Repaint everything that says which archives are open.
 *
 * The one entry point, called from BOTH armEmptyView() and commitSources() —
 * and that is not tidiness. Closing the LAST archive goes through the first of
 * those and not through the second, so anything painted only from
 * commitSources() would go on offering an account that is no longer open. That
 * exact bug has been fixed here once already, which is why there is one
 * function rather than two.
 *
 * It also re-reads the address, which is the other half of the same problem:
 * `clearIndexState()` drops the account filter whenever the source set changes,
 * because the record indices it was made of belong to a list that no longer
 * exists — and by the time this runs, the new list does, and the address still
 * says which account it wants. `applyAddress(true)` is that second reading; it
 * is forced because the address has not moved but its meaning has.
 */
function renderAccounts() {
  /* The sidebar button says what pressing it does: with a file already open it
     adds rather than replaces, so it stops saying 打开. */
  if (el.pickLabel) {
    el.pickLabel.textContent = archive.sources.length > 0 ? '添加归档' : '打开归档';
  }
  paintAccounts();
  refreshMe();
  applyAddress(true);
}

/**
 * The sidebar's list of accounts.
 *
 * One row per account rather than per file — the same grouping the 我 page and
 * 合并导出 use, so the three can never disagree about who is here.
 *
 * A row is a LINK to `#/@handle` and not a click handler, so that the browser's
 * own affordances work: middle-click, copy the address, see where it goes. An
 * account with no handle has no address, and gets a plain row instead — there
 * is nothing honest to link to.
 *
 * Every value goes in through textContent. A file name and a handle are both
 * things somebody else chose.
 */
function paintAccounts() {
  if (!el.sideAccts) return;
  el.sideAccts.textContent = '';
  var groups = groupSourcesByAccount();
  if (groups.length === 0) return;

  var head = document.createElement('div');
  head.className = 'side__head';
  head.textContent = '账号';
  el.sideAccts.appendChild(head);

  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var h = groupHandle(g);
    var nm = groupName(g);
    var row = document.createElement(h === null ? 'span' : 'a');
    row.className = 'side__acct' + (g.key === activeAccount ? ' on' : '');
    if (h !== null) row.href = hrefOf({ name: 'account', handle: h });
    row.title = h === null ? g.sources.map(function (k) {
      return archive.sources[k].file.name;
    }).join(' + ') : '@' + h;
    row.appendChild(document.createTextNode(nm || (h === null ? row.title : '@' + h)));

    var n = document.createElement('span');
    n.textContent = ' ' + fmtCount(groupRecordCount(g));
    row.appendChild(n);
    el.sideAccts.appendChild(row);
  }
}


/* ------------------------------------------------------------- profile -- */

/** A string field as written, or ''. Every key here may be missing or mistyped:
    the envelope may have been hand-edited, merged, or written by a version that
    spelled the field differently. */
function asText(v) {
  return typeof v === 'string' ? v : '';
}

/** A count as a number, or null. Negative and non-finite values are refused
    rather than rendered: "-3 关注者" is a broken file talking. */
function asNum(v) {
  return typeof v === 'number' && isFinite(v) && v >= 0 ? v : null;
}

/** `2026年3月加入` — the month is the DISPLAY zone's month, not UTC's. */
function fmtJoin(iso) {
  var ms = Date.parse(iso);
  if (!isFinite(ms)) return '';
  var d = zoneDate(ms);
  return d.getUTCFullYear() + '年' + (d.getUTCMonth() + 1) + '月加入';
}

/** A stored URL as it should read in one line: host and path, no scheme, cut
    before it can wrap. The full address stays on the element as its title. */
function shortUrl(href) {
  var s = href;
  try {
    var u = new URL(href);
    s = u.hostname.replace(/^www\./, '') + (u.pathname === '/' ? '' : u.pathname) + (u.search || '');
  } catch (_) { s = href; }
  return s.length > 42 ? s.slice(0, 41) + '…' : s;
}

/**
 * The meta line: where they are, what they linked to, when they joined.
 *
 * Only what the file holds appears. A placeholder for a missing field would be a
 * line of dots with nothing in it, and an empty profile is worth less than a
 * short one.
 */
function buildProfileMeta(p) {
  var items = [];
  var loc = asText(p.location);
  if (loc) {
    var l = span('pf__loc', loc);
    /* Only when it is long enough to be clamped by .pf__loc's two lines — a
       tooltip that repeats the short text next to it is noise. */
    if (loc.length > 40) l.title = loc;
    items.push(l);
  }
  var site = safeExternalUrl(asText(p.websiteUrl));
  if (site) {
    var a = document.createElement('a');
    a.href = site;                 /* a variable, never a literal in the markup */
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = shortUrl(site);
    a.title = site;
    items.push(a);
  }
  var joined = fmtJoin(asText(p.accountCreatedAt));
  if (joined) items.push(span('pf__join', joined));

  /* A locked account is a fact about every piece of it, so it goes in the line
     of facts rather than beside the name. Only when the capture actually said
     so: `protected` is null on anything written before this field existed, and
     an absent answer must not be drawn as an open account. */
  if (p.protected === true) items.push(span('pf__lock', '🔒 已锁定'));

  /* The post the account pinned. The archive usually holds that record — it is
     the first thing on the account's own timeline — so this links to it through
     the same route a card uses, and the route already knows what to say when
     the id is not in the file. An id nobody can follow would be noise. */
  var pinned = asText(p.pinnedTweetId);
  if (pinned) {
    var pin = document.createElement('a');
    pin.className = 'pf__pin';
    pin.textContent = '📌 置顶';
    pin.href = hrefOf({ name: 'post', handle: asText(p.screenName), id: pinned });
    pin.title = '打开这条置顶推文（不在归档里的话会说一声）';
    items.push(pin);
  }

  if (!items.length) return null;
  var line = document.createElement('div');
  line.className = 'pf__meta';
  for (var k = 0; k < items.length; k++) {
    if (k) line.appendChild(span('pf__dot', '·'));
    line.appendChild(items[k]);
  }
  return line;
}

/**
 * Following and followers, as X writes them in Chinese.
 *
 * Omitting a count the file does not carry, rather than showing a zero: a header
 * that says 0 关注者 about an account with followers is a wrong number, while no
 * number is merely an absent one. The exact figure is on the element as a title,
 * because fmtCount rounds — 12K for 12 345.
 */
function buildProfileCounts(p) {
  var following = asNum(p.followingCount);
  var followers = asNum(p.followersCount);
  /* The account's own total, which every source of a profile carries — the
     live capture reads it off the user node and an archived payload has it in
     `public_metrics` — and which this line used to leave out, while the comment
     below insisted it was here. It is the one number on the header that says
     how much of the account the archive is a window onto.
     Last, because 正在关注 and 关注者 are a pair and this is not one of them. */
  var posted = asNum(p.tweetCount);
  if (following === null && followers === null && posted === null) return null;

  var line = document.createElement('div');
  line.className = 'pf__counts';
  /* Clickable only when there is a list behind them. The profile card's counts
     come from the account's own figures; the rows come from the roster, and an
     archive can have one without the other — a card captured before the roster
     switch was ever turned on. A number that opens an empty room is worse than
     a number that is plainly just a number. */
  var openable = rosterAvailable();
  if (following !== null) line.appendChild(countBit(following, '正在关注', openable, 'following'));
  if (followers !== null) line.appendChild(countBit(followers, '关注者', openable, 'followers'));
  /* Never a button: the roster is a list of people, and there is no list of the
     account's posts to open — the timeline is already below. */
  if (posted !== null) line.appendChild(countBit(posted, '帖子', false, null));

  /* The three the profile carries that X's own header does not draw. Shown
     because the point of an archive is that it holds what the original does
     not keep on screen — and each is a real fact about the account rather than
     a derived number. Absent ones are simply not drawn. */
  var media = asNum(p.mediaCount);
  if (media !== null) line.appendChild(countBit(media, '媒体', false, null));
  var likes = asNum(p.likeCount);
  if (likes !== null) line.appendChild(countBit(likes, '喜欢', false, null));
  var listed = asNum(p.listedCount);
  if (listed !== null) line.appendChild(countBit(listed, '上列表', false, null));
  return line;
}

function countBit(value, label, openable, list) {
  var item = document.createElement(openable === true ? 'button' : 'span');
  item.className = openable === true ? 'pf__count pf__count--link' : 'pf__count';
  if (openable === true) {
    item.type = 'button';
    item.title = '打开' + label + '名单';
    item.addEventListener('click', function () { void openRoster(list); });
  }
  var b = document.createElement('b');
  b.textContent = fmtCount(value);
  b.title = String(value);
  item.appendChild(b);
  item.appendChild(document.createTextNode(' ' + label));
  return item;
}

/**
 * Put the real banner behind the header, when there is one to put there.
 *
 * Gated on the same switch as the avatars, and for the same reason: `bannerUrl`
 * is a pbs.twimg.com address, so fetching it tells X's CDN that this archive is
 * being read and roughly when. Off, the strip keeps the theme's flat grey —
 * which is what X itself draws for an account that never set a banner, so the
 * default state is a faithful one rather than a placeholder.
 *
 * The URL is only ever a variable. Nothing here builds markup, so there is no
 * `src=` for a literal to sit beside, and a URL that no longer resolves leaves
 * the grey underneath rather than a broken frame.
 */
function applyBannerImage(banner, p) {
  if (!prefs.remoteAvatars) return;
  var url = remoteMediaUrl(asText(p.bannerUrl));
  if (!url) return;
  banner.style.backgroundImage = 'url("' + url + '")';
}

/**
 * The account header, from the envelope's profile object.
 *
 * Every value goes in through textContent — no escaping step to forget, the same
 * rule the cards follow. The one exception is the verified badge, whose SVG is a
 * constant in this file and not data from the archive.
 *
 * Geometry follows X's own, measured at its 600px column rather than eyeballed:
 * banner 598x199, avatar 142 straddling the banner's bottom edge, name 20/800,
 * handle and meta at 15. See the .pf__ rules in the stylesheet.
 *
 * Returns false when there is nothing to show, and then the element is hidden
 * rather than left empty. An empty box above the timeline reads as a broken
 * header; the caller has a sentence that says what actually happened.
 */
function renderProfile(raw) {
  var p = raw && typeof raw === 'object' ? raw : null;
  el.profile.textContent = '';
  el.profile.hidden = true;
  /* The bar belongs to the header: no header, no bar. Leaving it up would put
     a name above a timeline that has no account behind it. */
  el.stickyBar.hidden = true;
  if (!p) return false;

  var name = asText(p.name);
  var handle = asText(p.screenName);
  if (!name && !handle) return false;

  /* Straight into #profile. There was a wrapper here while the header's height
     and its contents were driven separately; now that the header is ordinary
     content in the scroller, a wrapper would only be a node between the box and
     its children. */
  var banner = document.createElement('div');
  banner.className = 'pf__banner';
  applyBannerImage(banner, p);
  el.profile.appendChild(banner);

  var body = document.createElement('div');
  body.className = 'pf__body';

  /* The avatar sits ABOVE the name and straddles the banner's bottom edge,
     which is X's arrangement and the reason this header stops reading as flat.
     It is sized by the stylesheet — the third argument to avatarNode — so the
     collapsed state can shrink it to 36px; an inline width would beat any rule
     in the file. */
  var head = document.createElement('div');
  head.className = 'pf__head';
  /* Through the same node the cards use, which is what gives the header the
     letter-disc default and the `prefs.remoteAvatars` opt-in gate without
     either of them being re-implemented here. */
  var av = avatarNode({
    id: typeof p.userId === 'number' ? String(p.userId) : asText(p.userId),
    screenName: handle,
    name: name,
    avatarUrl: asText(p.avatarUrl),
    /* The picture the extension cached and the export inlined. Empty for every
       archive written before this existed, which is what makes it a fallback
       rather than a requirement. */
    avatarData: asText(p.avatarData)
  }, 142, true);
  av.classList.add('pf__avatar');
  head.appendChild(av);

  var id = document.createElement('div');
  id.className = 'pf__id';
  var names = document.createElement('div');
  names.className = 'pf__names';
  names.appendChild(span('pf__name', name || handle));
  if (p.blueVerified === true) {
    /* innerHTML from a constant, never from the record: this is X's SVG copied
       out of the live page, and nothing in the file can reach it. */
    var check = span('card__verified');
    check.innerHTML = verifiedIcon();
    check.title = 'X 认证（捕获时）';
    names.appendChild(check);
  }
  id.appendChild(names);
  /* The handle is PLAIN TEXT, not a link — the same rule the post text follows.
     The account may be gone, and following @someone out of an archive would
     leave the archive to land nowhere. */
  if (handle) id.appendChild(span('pf__handle', '@' + handle));
  head.appendChild(id);
  body.appendChild(head);

  var bio = renderBio(p);
  if (bio) {
    var bp = document.createElement('p');
    bp.className = 'pf__bio';
    bp.appendChild(bio);
    /* The element is clamped to four lines, and the clamp is invisible — so the
       whole text, with its newlines, is one hover away. */
    bp.title = asText(p.bio);
    body.appendChild(bp);
  }
  var meta = buildProfileMeta(p);
  if (meta) body.appendChild(meta);
  var counts = buildProfileCounts(p);
  if (counts) body.appendChild(counts);

  el.profile.appendChild(body);
  el.profile.hidden = false;

  /* The bar the header scrolls away into: the name and a post count, which is
     what X keeps and all it keeps.
   *
   * The number is how many records are in THIS FILE, not the account's
   * `tweetCount`. X shows the account's total because on X the timeline is the
   * account; here the file is all there is, and a bar reading "1.3K 帖子" above
   * a timeline of thirty is a number about somewhere else. The account's own
   * figure is on the header below, in the counts line — so both numbers are on
   * screen at once and they mean different things.「本档」is what keeps them
   * apart: without it the bar and the header both say "1.0K 帖子" about two
   * different quantities, and the reader has no way to tell which one moved. */
  el.sbName.textContent = name || handle || '';
  el.sbCount.textContent = '本档 ' + fmtCount(archive.ranges.length) + ' 帖子';
  el.stickyBar.hidden = false;
  return true;
}

/**
 * The header for a merged view of several accounts.
 *
 * Two different accounts open together have no single card that is true, but
 * they do have an answer worth drawing: the faces and the handles that are
 * open, and how much is behind them. Before this, that case drew nothing at
 * all — the area above the timeline was simply empty, with a line in the report
 * explaining why. An explanation is not a header.
 *
 * No banner and no 142px face on purpose — see the `.pf__multi` comment. What
 * is here is the same information a header carries, minus the claim that it
 * belongs to one person.
 */
function renderAccountList(list) {
  /* Two or more, and no fewer. One account whose card could not be drawn is a
     broken profile rather than a list, and "1 个账号" over it would be a header
     answering a question nobody asked — the caller's notice says what actually
     happened to that file. */
  if (!Array.isArray(list) || list.length < 2) return false;

  var body = document.createElement('div');
  body.className = 'pf__body pf__multi';

  var faces = document.createElement('div');
  faces.className = 'pf__faces';
  /* Every face would be a request for anybody who has opened a dozen archives,
     and past the first handful the row has stopped being readable anyway. */
  var shown = Math.min(list.length, 8);
  for (var i = 0; i < shown; i++) {
    var wrap = document.createElement('span');
    wrap.className = 'pf__face';
    wrap.appendChild(avatarNode({
      id: typeof list[i].userId === 'number' ? String(list[i].userId) : asText(list[i].userId),
      screenName: asText(list[i].screenName),
      name: asText(list[i].name),
      avatarUrl: asText(list[i].avatarUrl),
      avatarData: asText(list[i].avatarData)
    }, 48, true));
    faces.appendChild(wrap);
  }
  if (list.length > shown) {
    var more = document.createElement('span');
    more.className = 'pf__more';
    more.textContent = '还有 ' + (list.length - shown) + ' 个';
    faces.appendChild(more);
  }
  body.appendChild(faces);

  var id = document.createElement('div');
  id.className = 'pf__id';
  var names = document.createElement('div');
  names.className = 'pf__names';
  names.appendChild(span('pf__name', list.length + ' 个账号'));
  id.appendChild(names);

  /* The handles, in the order the files were opened, capped so one enormous set
     cannot turn the header into a wall. Each is PLAIN TEXT, the same rule the
     post text and the single header's handle follow. */
  var handles = [];
  for (var h = 0; h < list.length && handles.length < 6; h++) {
    var handle = asText(list[h].screenName);
    if (handle) handles.push('@' + handle);
  }
  if (handles.length > 0) {
    id.appendChild(span('pf__handle', handles.join(' · ') +
      (list.length > handles.length ? ' 等 ' + list.length + ' 个' : '')));
  }
  body.appendChild(id);

  var counts = document.createElement('div');
  counts.className = 'pf__counts';
  var n = document.createElement('span');
  n.className = 'pf__count';
  var nb = document.createElement('b');
  nb.textContent = fmtCount(archive.ranges.length);
  n.appendChild(nb);
  n.appendChild(document.createTextNode(' 条推文'));
  counts.appendChild(n);
  body.appendChild(counts);

  el.profile.appendChild(body);
  el.profile.hidden = false;

  el.sbName.textContent = list.length + ' 个账号';
  el.sbCount.textContent = '本档 ' + fmtCount(archive.ranges.length) + ' 帖子';
  el.stickyBar.hidden = false;
  return true;
}

/**
 * Draw the chrome the ADDRESS asks for — the header and the tab strip.
 *
 * It used to be drawn from `archive.profile`, which is derived from whichever
 * FILES are open. That is a different question from which page you are on, and
 * the two disagree the moment a second account is opened: `#/@alice` with alice
 * and bob both open drew a "2 个账号 · @alice · @bob" banner over a timeline
 * that is entirely alice's. The address says whose page this is; the header
 * follows the address.
 *
 *   #/@handle   that account's card — the whole point of the page
 *   anything else   no header at all
 *
 * The timeline and the search page are not one account's page, so a card over
 * either is a claim the page does not make. (The search page swaps in its own
 * strip; see the tab-strip block below.)
 *
 * ⚠️ CALLED LAST, always. renderProfile and renderAccountList both force
 * `hidden = false` on their way through, so anything that wants them hidden has
 * to run after them — and commitSources paints the header after it has already
 * applied the address once.
 */
function paintHeader(route) {
  var r = route || { name: 'unknown' };

  /* The post page is a layer over a view that is still there underneath, and
     `body.postOpen` hides the whole column — leave its header alone so coming
     back does not have to rebuild it. */
  if (r.name === 'post' && viewFor(r) !== 'me') return;

  var wantsCard = r.name === 'account';
  if (wantsCard) {
    if (renderProfile(profileForHandle(archive.accounts, r.handle)) ||
        renderAccountList(archive.accounts)) return;

    /* Nothing to draw. Two different states, and they are not the same
       sentence: an archive written before the header existed has no card for
       anybody, while one that has cards but not this one means the address
       names somebody else. */
    if (archive.accounts.length > 0) {
      addNotice('<b>@' + esc(r.handle) + ' 的账号资料不在现在打开的归档里。</b>' +
        '这些归档里有 ' + archive.accounts.length + ' 个账号的资料，但没有这一个。' +
        '下面是全部记录。', 'warn');
    } else {
      addNotice('<b>这些归档里没有账号资料，所以上面没有资料卡。</b>' +
        '这是较早版本的扩展导出的文件；用新版扩展重新导出一次，就会带上名称、简介和关注数。', 'warn');
    }
  }

  el.profile.hidden = true;
  el.profile.textContent = '';
  el.stickyBar.hidden = true;
  /* The bar keeps the last name and count it was given. Nothing renders them
     while it is hidden, but leaving one account's name sitting in the DOM
     after you have navigated to another page is the kind of thing that shows
     up the day something unhides the bar for a different reason. */
  el.sbName.textContent = '';
  el.sbCount.textContent = '';
}

/* ---------------------------------------------------------------- 我 ---
 *
 * The accounts that are open, one card each.
 *
 * A list of PEOPLE, not of files. Two exports of one handle are one account,
 * and showing them as two cards would be showing the same person twice — and
 * then offering to remove half of them. The grouping is
 * groupSourcesByAccount() in 80-export.js, which is the same grouping 合并导出
 * writes its files by: a card here and a file out of there can never mean
 * different things.
 *
 * What a card says is only what the envelope already holds. Notably absent is
 * the span of years the archive covers: that is a fact about the RECORDS, and
 * the only way to it is to read every one of them. A page that is redrawn
 * whenever the set of open files changes is the wrong place to spend a pass
 * over the whole file, and a range guessed from the first and last row would
 * be wrong on exactly the merged files this page exists for.
 * ------------------------------------------------------------------------ */

/* The account the timeline is narrowed to, as a group key, or null for "all of
   them". It lives here rather than beside `accountIds` because accountIds is a
   snapshot of record indices that a rebuild throws away, while this survives
   one — it is what puts the narrowing back. */
var activeAccount = null;

/** The handle a group's own profile claims, or null. */
function groupHandle(g) {
  var p = g && g.profile;
  var h = p && typeof p.screenName === 'string' ? p.screenName : '';
  return h.length > 0 ? h : null;
}

/** The display name a group's own profile claims, or null. */
function groupName(g) {
  var p = g && g.profile;
  var n = p && typeof p.name === 'string' ? p.name : '';
  return n.length > 0 ? n : null;
}

/** How many records the whole group has in the merged list, after folding. */
function groupRecordCount(g) {
  var n = 0;
  for (var i = 0; i < g.sources.length; i++) n += recordCountOf(g.sources[i]);
  return n;
}

/**
 * How many media FILES the group's archives carry.
 *
 * Counted off the media map each source built while it was being opened — a
 * count of entries in the ZIP, not a pass over the records. Zero for a JSON
 * export, which carries no files at all, and that is a true zero rather than a
 * number that could not be found.
 */
function groupMediaCount(g) {
  var n = 0;
  for (var i = 0; i < g.sources.length; i++) {
    var m = archive.sources[g.sources[i]].mediaMap;
    if (m && typeof m.size === 'number') n += m.size;
  }
  return n;
}

/**
 * When this account's card was last seen, or when its file was written.
 *
 * The same two fields, in the same order, that groupSourcesByAccount() uses to
 * decide which of several profiles is the freshest — so the date printed under
 * a name belongs to the card shown above it, and not to a different export of
 * the same account.
 */
function groupUpdatedAt(g) {
  var p = g && g.profile;
  var seen = p && typeof p.lastSeenAt === 'string' && p.lastSeenAt.length > 0 ? p.lastSeenAt : null;
  var made = null;
  for (var i = 0; i < g.sources.length; i++) {
    var e = archive.sources[g.sources[i]].envelope;
    var at = e && typeof e.exportedAt === 'string' ? e.exportedAt : '';
    if (at.length > 0 && (made === null || at > made)) made = at;
  }
  return shortDay(seen !== null ? seen : made);
}

/** `2026-09-21` in the display zone, or null. Not a clock: this is a caption. */
function shortDay(iso) {
  if (typeof iso !== 'string' || iso.length === 0) return null;
  var ms = Date.parse(iso);
  if (!isFinite(ms)) return null;
  var d = zoneDate(ms);
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

/** One of a card's three buttons. */
function meButton(label, run) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = label;
  b.addEventListener('click', function () { run(); });
  return b;
}

/**
 * One account, as a chunk of the 我 page.
 *
 * Every value goes in through textContent — a name, a bio and a handle are all
 * things somebody else chose, and this page renders them the same way the cards
 * and the profile header do.
 */
function meCard(g) {
  var p = g.profile && typeof g.profile === 'object' ? g.profile : {};
  var h = groupHandle(g);
  var nm = groupName(g);

  var card = document.createElement('div');
  card.className = 'me__card';

  var head = document.createElement('div');
  head.className = 'me__head';
  /* The same node the timeline and the header use, so the letter disc, the
     inlined picture the export carries and the `他人头像` opt-in gate are all
     the same three rules here as everywhere else. 48px inline: this avatar is
     a parameter of the call, not a state of the page. */
  head.appendChild(avatarNode({
    id: typeof p.userId === 'number' ? String(p.userId) : asText(p.userId),
    screenName: h === null ? '' : h,
    name: nm === null ? '' : nm,
    avatarUrl: asText(p.avatarUrl),
    avatarData: asText(p.avatarData)
  }, 48));

  var who = document.createElement('div');
  who.className = 'me__who';
  /* A source with no profile at all — a hand-built or truncated file — has no
     handle and no name, and the only true thing left to call it is the file it
     came from. */
  who.appendChild(span('me__name', nm || (h === null ? '' : '@' + h) || g.sources.map(function (k) {
    return archive.sources[k].file.name;
  }).join(' + ')));
  if (h !== null) who.appendChild(span('me__handle', '@' + h));
  head.appendChild(who);
  card.appendChild(head);

  var bio = asText(p.bio);
  if (bio) {
    var bp = document.createElement('p');
    bp.className = 'me__bio';
    bp.textContent = bio;
    /* Clamped to three lines, and the clamp is invisible — so the whole text,
       newlines and all, is one hover away. */
    bp.title = bio;
    card.appendChild(bp);
  }

  var bits = [fmtCount(groupRecordCount(g)) + ' 条推文'];
  var media = groupMediaCount(g);
  if (media > 0) bits.push(fmtCount(media) + ' 张图');
  if (g.sources.length > 1) bits.push(g.sources.length + ' 个归档文件');
  var updated = groupUpdatedAt(g);
  if (updated !== null) bits.push('最后更新 ' + updated);
  var meta = document.createElement('p');
  meta.className = 'me__meta';
  meta.textContent = bits.join(' · ');
  card.appendChild(meta);

  var acts = document.createElement('div');
  acts.className = 'me__acts';
  /* Only when there is somewhere to go. `#/@handle` is the address of this
     account, and an account with no handle has no address — so that one card
     offers the two actions that do not need one. */
  if (h !== null) {
    acts.appendChild(meButton('打开', function () {
      go({ name: 'account', handle: h });
    }));
  }
  acts.appendChild(meButton('＋ 加这个账号的其他归档', function () { el.pick.click(); }));
  acts.appendChild(meButton('移除', function () { void removeGroup(g); }));
  card.appendChild(acts);

  return card;
}

/**
 * Close every archive that makes up one account.
 *
 * One source at a time, through the path that already knows how to rebuild —
 * dedupe, sort, renumber, repaint. Splicing them all out first would renumber
 * the list underneath the loop that was walking it. Highest index first, so
 * the ones still to be removed keep the numbers they were found under.
 */
async function removeGroup(g) {
  var wasActive = g.key === activeAccount;
  for (var i = g.sources.length - 1; i >= 0; i--) {
    await removeSourceAt(g.sources[i]);
  }
  /* The account the reader was looking at is gone, so the address that names it
     is a dead link. 我 是 where they were, and it is where the change shows. */
  if (wasActive) replaceRoute({ name: 'me' });
}

/**
 * The 我 page, from the archives that are open.
 *
 * Called from renderAccounts(), which is the one function both armEmptyView()
 * and commitSources() go through — so closing the last archive repaints this
 * as surely as opening the first one does.
 */
function refreshMe() {
  if (!el.meList) return;
  var groups = groupSourcesByAccount();

  /* Which of the two halves of the page is on screen. #drop is the empty state
     and its display is switched in three places in 20-loading.js; this is the
     fourth and the one that survives them all, because renderAccounts() runs on
     both paths. */
  el.drop.style.display = groups.length === 0 ? '' : 'none';
  el.meScroll.hidden = groups.length === 0;

  el.meList.textContent = '';
  for (var i = 0; i < groups.length; i++) el.meList.appendChild(meCard(groups[i]));

  if (groups.length > 0) {
    var add = meButton('＋ 添加归档', function () { el.pick.click(); });
    add.className = 'btn me__add';
    el.meList.appendChild(add);
  }
}

/* --------------------------------------------------------------- the roster --
 *
 * The follow / follower list, behind the two numbers on the profile header —
 * X's arrangement, and the one the report asked for: "粉丝关注肯定推特一样放".
 *
 * The data has been in the archive since the roster was added and this page has
 * never read it. `indexSource` scans the envelope for the key and records
 * `hasRoster`; that flag was only ever used to print "这个页面不显示它". Here it
 * finally means something.
 *
 * LAZY, and not as an optimisation. A roster is one row per person and runs to
 * tens of megabytes on a big account; reading it on every open would make
 * opening an archive cost something most opens never use. `hasRoster` is a
 * cheap byte scan, so the door can be offered without paying for the room.
 *
 * The union rule is NOT re-implemented here. `groupConnections` already merges
 * a group's rosters with "the later sighting wins", and the export writes that
 * same answer out; a second copy of the rule would let the list on screen and
 * the list in the file disagree.
 */

var roster = {
  loaded: false,      /* the rows have been read for the CURRENT set of sources */
  loading: false,
  rows: [],
  error: null,
  list: 'following',  /* which of the two lists is on screen */
  q: ''
};

/** Called from resetArchive: a different set of sources is a different roster. */
function resetRoster() {
  roster.loaded = false;
  roster.loading = false;
  roster.rows = [];
  roster.error = null;
  roster.list = 'following';
  roster.q = '';
  if (el.rosterFilter) el.rosterFilter.value = '';
}

/** True when at least one open source says it carries a roster. */
function rosterAvailable() {
  return archive.envelope !== null && archive.envelope.hasRoster === true;
}

/**
 * Read every open source's roster, once.
 *
 * Anything that goes wrong is a sentence on the page, never a throw: the roster
 * is a side room of the archive, and failing to open it must not take the
 * timeline down with it.
 */
async function loadRoster() {
  if (roster.loaded || roster.loading) return roster;
  roster.loading = true;
  roster.error = null;
  try {
    var groups = groupSourcesByAccount();
    var all = [];
    for (var g = 0; g < groups.length; g++) {
      var got = await groupConnections(groups[g]);
      for (var i = 0; i < got.rows.length; i++) all.push(got.rows[i]);
    }
    roster.rows = all;
    roster.loaded = true;
  } catch (err) {
    roster.error = err && err.message ? String(err.message) : '读不出来';
  } finally {
    roster.loading = false;
  }
  return roster;
}

/** One row of the list, as X draws one: face, name, handle, bio. */
function rosterRow(row) {
  var wrap = document.createElement('div');
  wrap.className = 'rp__row';

  var handle = asText(row.screenName);
  wrap.appendChild(avatarNode({
    id: asText(row.userId),
    screenName: handle,
    name: asText(row.name),
    avatarUrl: asText(row.avatarUrl)
  }, 48));

  var who = document.createElement('div');
  who.className = 'rp__who';

  var line = document.createElement('div');
  var name = asText(row.name);
  line.appendChild(span('rp__name', name !== '' ? name : (handle !== '' ? '@' + handle : '（没有名字）')));
  if (handle !== '') line.appendChild(span('rp__handle', ' @' + handle));
  who.appendChild(line);

  var bio = asText(row.bio);
  if (bio !== '') who.appendChild(span('rp__bio', bio));

  wrap.appendChild(who);
  return wrap;
}
