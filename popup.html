<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Tweet Backup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<!--
  Every piece of text here is filled in from _locales/<lang>/messages.json at
  boot (see applyStaticText in popup.js). Nothing user-authored ever goes
  through data-i18n-html — those two messages are our own strings, and they are
  the only place innerHTML is used at all.
-->
<body>
  <div class="app">
    <header class="header">
      <div class="header__title">
        <h1>X Tweet Backup</h1>
      </div>
      <!-- The status line sits in the header, to the right of the title. It used
           to be a full-width row between the toolbar and the list, where a long
           message had nowhere to go and was clipped — "choices saved" ran off
           the edge exactly when the user most needed to read it. -->
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <button id="btn-refresh" class="icon-button" type="button" data-i18n-title="refresh">↻</button>
    </header>

    <section class="summary" data-i18n-aria-label="summaryAria">
      <div class="summary__item">
        <span class="summary__value" id="stat-count">–</span>
        <span class="summary__label" data-i18n="statCount"></span>
      </div>
      <div class="summary__item">
        <span class="summary__value" id="stat-usage">–</span>
        <span class="summary__label" data-i18n="statUsage"></span>
      </div>
      <div class="summary__item">
        <span class="summary__value" id="stat-media">–</span>
        <span class="summary__label" data-i18n="statMedia"></span>
      </div>
      <div class="summary__item">
        <span class="summary__value" id="stat-last">–</span>
        <span class="summary__label" data-i18n="statLast"></span>
      </div>
    </section>

    <section class="toolbar">
      <input id="search" class="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
      <button id="btn-export" class="button button--primary" type="button" data-i18n="exportJson"></button>
    </section>

    <!-- Posts / Following / Followers. Always in the markup, visible only in the
         full-page layout — CSS owns that decision (see .viewswitch in popup.css),
         so a wrong guess in JS cannot put it in front of a 440px popup. The JS
         predicate is only used to leave the roster view when the layout
         collapses under it. -->
    <nav class="viewswitch" id="viewswitch" data-i18n-aria-label="viewSwitchAria">
      <button type="button" class="viewswitch__tab" id="view-tweets" data-i18n="viewTweets"></button>
      <button type="button" class="viewswitch__tab" id="view-following" data-i18n="viewFollowing"></button>
      <button type="button" class="viewswitch__tab" id="view-followers" data-i18n="viewFollowers"></button>
    </nav>

    <main id="list" class="list" data-i18n-aria-label="listAria"></main>

    <!-- The roster. A SIBLING of #list, never a child: reload() and
         showEmptyState() empty their container's children on every search and
         refresh, so anything living inside #list is destroyed on the first
         keystroke. Only one of the two is ever shown. -->
    <main id="connections" class="list" hidden data-i18n-aria-label="connectionsAria"></main>

    <div class="list-footer">
      <button id="btn-more" class="button button--wide" type="button" data-i18n="loadMore" hidden></button>
      <p id="list-hint" class="list-hint"></p>
    </div>

    <details class="diagnostics" id="diagnostics" hidden>
      <summary data-i18n="diagnosticsSummary"></summary>
      <dl class="diagnostics__grid" id="diagnostics-grid"></dl>
      <button id="btn-reset-stats" class="button button--small" type="button" data-i18n="resetCounts"></button>
    </details>

    <footer class="footer">
      <div class="footer__actions">
        <button id="btn-tab" class="button button--small" type="button" data-i18n="openInTab"></button>
        <button id="btn-fill-media" class="button button--small" type="button" data-i18n="fillMedia" data-i18n-title="fillMediaTitle"></button>
        <button id="btn-media" class="button button--small" type="button" data-i18n="exportArchive" data-i18n-title="exportArchiveTitle"></button>
        <button id="btn-clear" class="button button--danger button--small" type="button" data-i18n="clearAll"></button>
      </div>

      <!-- Settings, bulk cleanup and the long explanatory notes. Closed by
           default: these are visited rarely and the controls inside them are
           not the reason anyone opens the popup. -->
      <details class="settings" id="settings">
        <summary data-i18n="settingsSummary"></summary>

        <!-- Everything below scrolls inside this box rather than growing the
             popup. Expanded inline, the settings pushed the list off the bottom
             of the screen — and on a phone, where the popup is shorter, they
             swallowed it entirely. The list is the reason the popup is open;
             settings may scroll, but they do not get to take the whole window. -->
        <div class="settings__body">

        <!-- The four that decide what gets kept, in the order the first-run
             panel asks them, then the debug switch. Debug was first here for a
             long time and it was the wrong place for it: it is not a preference
             about the archive at all, only a switch for the panel that explains
             the machinery, so it was the first thing read and the last thing
             wanted. -->
        <label class="toggle">
          <input type="checkbox" id="opt-thumbs">
          <span data-i18n="optThumbs"></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-media">
          <span data-i18n="optMedia"></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-backfill-media">
          <span data-i18n="optBackfillMedia"></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-capture-replies">
          <span data-i18n="optCaptureReplies"></span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-capture-connections">
          <span data-i18n="optCaptureConnections"></span>
        </label>
        <!-- Two states, chosen at render time: what it does, or why it is not
             doing anything yet. A fresh install cannot know which account is
             yours until it has seen you publish, and a switch that silently
             stores nothing is indistinguishable from a broken one. -->
        <p class="settings__note" id="note-connections"></p>

        <label class="toggle">
          <input type="checkbox" id="opt-debug">
          <span data-i18n="optDebug"></span>
        </label>

        <!-- The first-run panel, read again. A one-time dialog with no way back
             is a trap: what gets remembered is the answer, not the reasoning
             behind it, and a user who answered before understanding the cost has
             no way to revisit the question. -->
        <button id="btn-choice-show" class="button button--small settings__action" type="button" data-i18n="showChoicePanel"></button>

        <details class="cleanup" id="cleanup">
          <summary data-i18n="cleanupSummary"></summary>
          <p class="cleanup__note" data-i18n="cleanupNote"></p>
          <div class="cleanup__row">
            <span class="cleanup__label"><span data-i18n="cleanupSuperseded"></span><span class="cleanup__count" id="cleanup-superseded-count">–</span></span>
            <button id="btn-purge-superseded" class="button button--danger button--small" type="button" data-i18n="delete" disabled></button>
          </div>
          <div class="cleanup__row">
            <span class="cleanup__label"><span data-i18n="cleanupDeleted"></span><span class="cleanup__count" id="cleanup-deleted-count">–</span></span>
            <button id="btn-purge-deleted" class="button button--danger button--small" type="button" data-i18n="delete" disabled></button>
          </div>
        </details>

        <!-- The reload warning lives here rather than in the footer. It used to
             sit outside on the argument that an actionable warning must not be
             hidden — but the action only applies to an unpacked install being
             reloaded by hand, and for a store install the extension updates
             itself. Worse, anything missed that way is recovered by the next
             profile sweep, so the warning was shouting about a loss that mostly
             is not one. The one case it does still matter — a deletion made
             from a stale tab, which leaves no tombstone — is worth reading, and
             that is what a note inside Settings is for. -->
        <p class="footer__note footer__note--warning" data-i18n-html="warnReload"></p>
        <p class="footer__note" data-i18n="noteStorage"></p>
        <p class="footer__note" data-i18n="noteBackfill"></p>
        <p class="footer__note" data-i18n-html="noteSnapshot"></p>
        </div>
      </details>
    </footer>
  </div>

  <!-- First-run choices. A MODAL over the popup, never a block inside it: a
       Chromium popup is capped at 600px and the list is the only reason anyone
       opens it, so a panel that took list height would cost exactly the thing it
       is asking about. `position: fixed` keeps it out of the layout entirely —
       the list is built behind it and is not shortened by a single pixel.

       The four checkboxes start from whatever is actually stored, so re-opening
       it shows the current answers rather than resetting them to the defaults. -->
  <div class="choice" id="choice" hidden>
    <div class="choice__panel" role="dialog" aria-modal="true" aria-labelledby="choice-title">
      <h2 class="choice__title" id="choice-title" data-i18n="choiceTitle"></h2>
      <p class="choice__intro" data-i18n="choiceIntro"></p>

      <div class="choice__option">
        <label class="toggle">
          <input type="checkbox" id="choice-media">
          <span data-i18n="optMedia"></span>
        </label>
        <p class="choice__cost" data-i18n="choiceMediaCost"></p>
      </div>

      <div class="choice__option">
        <label class="toggle">
          <input type="checkbox" id="choice-backfill">
          <span data-i18n="optBackfillMedia"></span>
        </label>
        <p class="choice__cost" data-i18n="choiceBackfillCost"></p>
      </div>

      <div class="choice__option">
        <label class="toggle">
          <input type="checkbox" id="choice-replies">
          <span data-i18n="optCaptureReplies"></span>
        </label>
        <p class="choice__cost" data-i18n="choiceRepliesCost"></p>
      </div>

      <div class="choice__option">
        <label class="toggle">
          <input type="checkbox" id="choice-thumbs">
          <span data-i18n="optThumbs"></span>
        </label>
        <p class="choice__cost" data-i18n="choiceThumbsCost"></p>
      </div>

      <p class="choice__note" data-i18n="choiceCoreNote"></p>

      <!-- The one thing on this panel that is not a preference. Everything
           above asks what to keep; this says the archive can disappear without
           anyone choosing anything — clearing browser data, uninstalling, or a
           dead profile takes it — and that the export is the only copy that
           survives. Coloured apart and placed last, immediately before the
           button, so it is read on the way to the action rather than skipped
           as one more paragraph of explanation. -->
      <p class="choice__warning" data-i18n="choiceWarning"></p>

      <button id="btn-choice-confirm" class="button button--primary button--wide" type="button" data-i18n="choiceConfirm"></button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
